<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WindowsForms.LifetimeTests</title>
    <base href="/" />
    <style>
        body { font-family: "Segoe UI", system-ui, sans-serif; margin: 1rem; }
        /* Blazor shows this element only when an unhandled error occurs. */
        #blazor-error-ui { display: none; background: lightyellow; padding: 0.5rem 1rem; position: fixed; bottom: 0; left: 0; right: 0; }
        .errorUI { color: #b32121; }
    </style>
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js"></script>
</body>

</html>
