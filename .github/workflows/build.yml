name: Build

on:
  push:
    branches:
      - '**'
  # Called by publish-nuget.yml so a release only goes out when every job here passes.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WebView.slnx

      - name: Build
        run: dotnet build WebView.slnx --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

      # Examples and tests use ProjectReference, so check what actually goes into the packages.
      - name: Pack and verify packages
        shell: pwsh
        run: |
          foreach ($project in 'WindowsForms/Microsoft.AspNetCore.Components.WebView.WindowsForms.csproj', 'Wpf/Microsoft.AspNetCore.Components.WebView.Wpf.csproj', 'Win32Aot/Microsoft.AspNetCore.Components.WebView.Win32Aot.csproj') {
            dotnet pack $project --configuration Release --no-build --output artifacts/packages
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./tests/package/Test-Packages.ps1 -PackageDir artifacts/packages

  # NativeAOT compilation needs the MSVC linker, so it runs on Windows.
  win32aot-native-aot:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish example with NativeAOT
        shell: pwsh
        run: |
          dotnet publish examples/Win32Aot.BlazorApp/Win32Aot.BlazorApp.csproj -c Release -r win-x64 -o artifacts/win32aot-example -p:TrimmerSingleWarn=false 2>&1 | Tee-Object -Variable output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Blazor itself still produces trim/AOT warnings; the Win32Aot host must not.
          $own = $output | Select-String -Pattern 'warning IL\d+' | Select-String -SimpleMatch 'Microsoft.AspNetCore.Components.WebView.Win32Aot'
          if ($own) {
            $own | ForEach-Object { Write-Host "::error::$($_.Line)" }
            exit 1
          }

      - name: Verify publish output
        shell: pwsh
        run: |
          # The example uses a ProjectReference, so WebView2Loader.dll is copied under runtimes\win-<arch>\native
          # (probed by WebView2Utilities.Initialize). NuGet consumers get it next to the exe instead.
          foreach ($file in 'Win32Aot.BlazorApp.exe', 'runtimes/win-x64/native/WebView2Loader.dll', 'wwwroot/index.html', 'wwwroot/_framework/blazor.webview.js') {
            if (-not (Test-Path "artifacts/win32aot-example/$file")) { Write-Host "::error::Missing $file"; exit 1 }
          }

      # The hosted Windows runner has an interactive desktop and the WebView2 Runtime, so the tests open real windows.
      # Lifetime scenarios from dotnet/maui#34855 (windows closed while components keep working); exit code 0 = all pass.
      - name: Lifetime tests (JIT)
        shell: pwsh
        timeout-minutes: 10
        run: dotnet run --project tests/Win32Aot.LifetimeTests/Win32Aot.LifetimeTests.csproj -c Release

      - name: Lifetime tests (NativeAOT)
        shell: pwsh
        timeout-minutes: 15
        run: |
          dotnet publish tests/Win32Aot.LifetimeTests/Win32Aot.LifetimeTests.csproj -c Release -r win-x64 -o artifacts/win32aot-lifetime-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          artifacts/win32aot-lifetime-tests/Win32Aot.LifetimeTests.exe

      # Drives the published example through UI Automation. UIAutomationClient needs Windows PowerShell.
      # UI timing on shared runners can be flaky, so one retry is allowed.
      - name: UI smoke test of the NativeAOT example
        shell: powershell
        timeout-minutes: 10
        run: |
          foreach ($attempt in 1, 2) {
            powershell -NoProfile -ExecutionPolicy Bypass -File tests/ui/Test-BlazorApp.ps1 -Exe artifacts/win32aot-example/Win32Aot.BlazorApp.exe -OutDir "artifacts/ui-test/attempt-$attempt" -ExpectNativeAot
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "::warning::UI smoke test attempt $attempt failed"
          }
          exit 1

      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win32aot-ui-test-screenshots
          path: artifacts/ui-test/
          if-no-files-found: ignore

  # The same lifetime scenarios and UI smoke test for the Windows Forms and WPF hosts (JIT only).
  desktop-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: WindowsForms
            heading: Blazor in Windows Forms
          - host: Wpf
            heading: Blazor in WPF

    name: ${{ matrix.host }} tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The WindowsForms and Wpf hosts target net9.0-windows, so the tests need the .NET 9 runtime.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Lifetime tests
        shell: pwsh
        timeout-minutes: 10
        run: dotnet run --project tests/${{ matrix.host }}.LifetimeTests/${{ matrix.host }}.LifetimeTests.csproj -c Release

      - name: Publish example
        shell: pwsh
        run: dotnet publish examples/${{ matrix.host }}.BlazorApp/${{ matrix.host }}.BlazorApp.csproj -c Release -o artifacts/example

      - name: UI smoke test of the example
        shell: powershell
        timeout-minutes: 10
        run: |
          foreach ($attempt in 1, 2) {
            powershell -NoProfile -ExecutionPolicy Bypass -File tests/ui/Test-BlazorApp.ps1 -Exe artifacts/example/${{ matrix.host }}.BlazorApp.exe -HomeHeading '${{ matrix.heading }}' -OutDir "artifacts/ui-test/attempt-$attempt"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "::warning::UI smoke test attempt $attempt failed"
          }
          exit 1

      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.host }}-ui-test-screenshots
          path: artifacts/ui-test/
          if-no-files-found: ignore
