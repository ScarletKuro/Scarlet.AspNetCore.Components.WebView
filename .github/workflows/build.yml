name: Build

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WebView.slnx

      - name: Build
        run: dotnet build WebView.slnx --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

  # NativeAOT compilation needs the MSVC linker, so it runs on Windows.
  win32aot-native-aot:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish example with NativeAOT
        shell: pwsh
        run: |
          dotnet publish examples/Win32Aot.BlazorApp/Win32Aot.BlazorApp.csproj -c Release -r win-x64 -o artifacts/win32aot-example -p:TrimmerSingleWarn=false 2>&1 | Tee-Object -Variable output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Blazor itself still produces trim/AOT warnings; the Win32Aot host must not.
          $own = $output | Select-String -Pattern 'warning IL\d+' | Select-String -SimpleMatch 'Microsoft.AspNetCore.Components.WebView.Win32Aot'
          if ($own) {
            $own | ForEach-Object { Write-Host "::error::$($_.Line)" }
            exit 1
          }

      - name: Verify publish output
        shell: pwsh
        run: |
          foreach ($file in 'Win32Aot.BlazorApp.exe', 'WebView2Loader.dll', 'wwwroot/index.html', 'wwwroot/_framework/blazor.webview.js') {
            if (-not (Test-Path "artifacts/win32aot-example/$file")) { Write-Host "::error::Missing $file"; exit 1 }
          }
