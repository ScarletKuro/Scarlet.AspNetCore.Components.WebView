name: Release

# Run manually (Actions > Release > Run workflow): each package is released on its own, with its own version.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        type: choice
        options:
          - Win32Aot
          - Wpf
          - WindowsForms
      version:
        description: Package version (SemVer 2.0), e.g. 1.2.0 or 1.3.0-preview.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.package.outputs.project }}
      package_id: ${{ steps.package.outputs.package_id }}
      tag: ${{ steps.package.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate the request
        id: package
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Release from $DEFAULT_BRANCH, not $REF_NAME."
            exit 1
          fi

          version="$VERSION"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver_pattern ]]; then
            echo "::error::'$version' is not a valid SemVer 2.0.0 version."
            exit 1
          fi

          package="$PACKAGE"
          tag="$package-$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag was already released (the tag exists)."
            exit 1
          fi

          echo "project=$package/Microsoft.AspNetCore.Components.WebView.$package.csproj" >> "$GITHUB_OUTPUT"
          echo "package_id=Scarlet.AspNetCore.Components.WebView.$package" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Build, NativeAOT checks, lifetime tests and UI smoke tests: a release only goes out when every job passes.
  tests:
    needs: prepare
    uses: ./.github/workflows/build.yml

  publish:
    needs: [prepare, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      PROJECT: ${{ needs.prepare.outputs.project }}
      PACKAGE_ID: ${{ needs.prepare.outputs.package_id }}
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "$PROJECT"

      - name: Build
        run: dotnet build "$PROJECT" --configuration Release --no-restore /p:ContinuousIntegrationBuild=true "/p:Version=$VERSION"

      - name: Pack
        run: dotnet pack "$PROJECT" --configuration Release --no-build --output packages "/p:PackageVersion=$VERSION" "/p:Version=$VERSION"

      - name: Verify package
        shell: pwsh
        run: ./tests/package/Test-Packages.ps1 -PackageDir packages -Package $env:PACKAGE_ID

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package to NuGet
        run: |
          dotnet nuget push ./packages/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

          dotnet nuget push ./packages/*.snupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Tag the release
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
